spring.application.name=Task Management Rest Api

# Load local secrets from this file (gitignored). Copy from application-local.properties.example
spring.config.import=optional:classpath:application-local.properties

# JWT — override with JWT_SECRET env var or application-local.properties
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# MySQL — override with DB_PASSWORD / SPRING_DATASOURCE_* env vars or application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
